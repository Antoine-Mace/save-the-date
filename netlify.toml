[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # CUSTOMIZE: the CSP only allows the site's own origin ('self'). If you embed outside content
    # (maps iframe, analytics, remote fonts or media), widen the matching directive. Plain links
    # that open in a new tab are unaffected.
    # 'unsafe-inline' is required for script-src: pages are statically prerendered,
    # so there is no per-request nonce to give Next.js' inline bootstrap.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
